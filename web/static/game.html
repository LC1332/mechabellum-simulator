<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Mechabellum 审计游戏</title>
<style>
:root{--bg:#14171c;--panel:#1b1f26;--panel2:#20252e;--line:#2c333f;--fg:#cfd8e3;
--blue:#6cf;--red:#f86;--gold:#ffd54a;--dim:#7a8699;--ok:#7ec97e;--bad:#f77;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.45 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:4px 12px;cursor:pointer;font-size:12px}
button:hover{border-color:#48556a}
button:disabled{opacity:.35;cursor:not-allowed}
button.primary{background:#2b4a6f;border-color:#3d6ea8}
button.warn{background:#6f3a2b;border-color:#a8543d}
button.big{font-size:14px;padding:6px 22px;font-weight:600}
input,select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:3px 8px}
.tag{padding:1px 7px;border-radius:9px;font-size:11px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.tag.blue{color:var(--blue);border-color:var(--blue)}
.tag.red{color:var(--red);border-color:var(--red)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.tag.gold{color:var(--gold);border-color:var(--gold)}
.mono{font-family:Consolas,monospace;font-size:11px}
.dim{color:var(--dim)}.ok{color:var(--ok)}.bad{color:var(--bad)}.gold{color:var(--gold)}
/* -------------------------------------------------- HUD */
#hud{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);min-height:52px}
.pl{display:flex;align-items:center;gap:8px;min-width:230px}
.pl .avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#0d0f13}
.pl.human .avatar{background:var(--blue)}
.pl.opp .avatar{background:var(--red)}
.pl .nm{font-weight:600;font-size:12px}
.pl.human .nm{color:var(--blue)}
.pl.opp .nm{color:var(--red)}
.hpbar{width:150px;height:7px;background:#0d0f13;border-radius:4px;overflow:hidden;margin-top:3px}
.hpbar i{display:block;height:100%;background:var(--ok)}
.pl.opp .hpbar i{background:#d67f5f}
.pl .sub{font-size:11px;color:var(--dim)}
.supply{color:var(--gold);font-weight:700;font-size:13px;transition:transform .15s}
.supply.flash{transform:scale(1.35)}
#hudCenter{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
#hudPhase{display:flex;align-items:center;gap:10px}
#hudPhase .rnd{font-size:16px;font-weight:700;color:var(--gold)}
#hudMain{display:flex;gap:8px;align-items:center}
#hudAux{display:flex;gap:6px;align-items:center}
#hudAux button{padding:2px 8px;font-size:11px;color:var(--dim)}
/* -------------------------------------------------- main */
#main{flex:1;display:flex;min-height:0}
#left{width:248px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#ltabs{display:flex;border-bottom:1px solid var(--line)}
#ltabs button{flex:1;border:none;border-radius:0;border-right:1px solid var(--line);background:var(--panel);padding:5px 0}
#ltabs button.on{background:var(--panel2);color:var(--gold)}
#lbody{flex:1;overflow-y:auto;padding:8px}
.shopitem{display:flex;align-items:center;gap:6px;padding:5px 6px;border:1px solid var(--line);border-radius:5px;margin-bottom:5px;background:var(--panel2)}
.shopitem .nm{flex:1;min-width:0}
.shopitem .nm small{color:var(--dim);display:block}
.shopitem .pr{color:var(--gold);white-space:nowrap}
.shopitem.locked{opacity:.8}
.shopitem.picked{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.shopitem:not(.locked){cursor:pointer}
.shopitem:focusable{outline:none}
#center{flex:1;display:flex;flex-direction:column;min-width:0}
#status{padding:3px 10px;background:var(--panel);border-bottom:1px solid var(--line);color:var(--dim);min-height:22px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#playctl{display:none;gap:8px;align-items:center;padding:4px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;background:#0d0f13;position:relative;overflow:hidden}
canvas{max-width:100%;max-height:100%;display:block}
#tip{position:absolute;pointer-events:none;background:rgba(20,24,30,.94);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:11px;display:none;z-index:15;max-width:220px}
/* -------------------------------------------------- right */
#right{width:264px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:8px}
.kv{display:flex;gap:8px;margin-bottom:3px;font-size:12px}
.kv .k{color:var(--dim);width:70px;flex:none}
/* -------------------------------------------------- audit drawer */
#audit{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;flex:none}
#auditbar{display:flex;align-items:center;gap:12px;padding:4px 12px;cursor:pointer;user-select:none}
#auditbar:hover{background:var(--panel2)}
#auditbar .arrow{transition:transform .15s}
#audit.open #auditbar .arrow{transform:rotate(90deg)}
#auditPanel{display:none;flex-direction:column;height:38vh;min-height:150px}
#audit.open #auditPanel{display:flex}
#atabs{display:flex;border-bottom:1px solid var(--line)}
#atabs button{border:none;border-radius:0;border-right:1px solid var(--line);background:var(--panel);padding:4px 12px}
#atabs button.on{background:var(--panel2);color:var(--gold)}
#abody{flex:1;overflow:auto;padding:8px;font-size:12px}
table.t{border-collapse:collapse;width:100%}
table.t td,table.t th{border:1px solid var(--line);padding:2px 6px;text-align:left;vertical-align:top}
table.t th{color:var(--dim);font-weight:normal;background:var(--panel2)}
.audit-ev{border-bottom:1px solid #232a34;padding:3px 2px;font-size:11px}
.diffs .p{color:var(--gold);font-family:Consolas,monospace;font-size:11px}
/* -------------------------------------------------- overlays */
#overlay{position:fixed;inset:0;background:rgba(8,10,14,.75);z-index:60;display:none;align-items:center;justify-content:center}
#overlay .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px 26px;max-width:560px;max-height:80vh;overflow:auto}
#cardLayer{position:absolute;inset:0;background:rgba(10,12,17,.93);z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
#cardLayer h2{font-size:17px;color:var(--gold)}
#cardLayer .sub{color:var(--dim);font-size:12px}
#cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%;max-width:1240px;align-items:stretch}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:0}
.card:focus-within{border-color:var(--gold)}
.card h3{font-size:13px}
.card .unitline{font-size:12px}
.card .foot{margin-top:auto;display:flex;align-items:center;gap:8px}
.card button{width:100%}
.card.unsupported{opacity:.62}
@media (max-width:1500px){#cards{grid-template-columns:repeat(2,minmax(0,1fr));max-width:680px}}
/* -------------------------------------------------- select view */
#selectView{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;padding:22px 28px}
#selectView h1{font-size:19px;margin-bottom:4px}
#selectView .sub{color:var(--dim);margin-bottom:14px;max-width:900px}
.optrow{border:1px solid var(--line);border-radius:6px;padding:9px 13px;margin-bottom:9px;display:flex;gap:14px;align-items:center;background:var(--panel)}
.optrow.dis{opacity:.66}
.optrow.best{border-color:var(--gold)}
.optrow .grow{flex:1;min-width:0}
.optrow .tags{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0}
.blockers{color:var(--bad);font-size:11px;margin-top:2px}
.blockers .dim{color:var(--dim)}
.optbtns{display:flex;flex-direction:column;gap:5px}
</style>
</head>
<body>

<!-- ================= select view ================= -->
<div id="selectView">
  <h1>Mechabellum · 审计游戏</h1>
  <div class="sub">选择一条 Normal 1v1 回放的一名玩家作为「历史策略对手」，你接管另一方，从 round 0 开局开始逐动作审查 transition。
   <span class="tag">开局/增援候选与对手动作来自真实回放</span><span class="tag">战斗由 pysim 模拟</span></div>
  <div style="margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <input id="fFilter" placeholder="按玩家名/文件名筛选" style="width:240px">
    <select id="fMode">
      <option value="normal">仅普通开始</option>
      <option value="limited">包含受限开始</option>
      <option value="all">全部（含禁用）</option>
    </select>
    <span id="libMeta" class="dim"></span>
  </div>
  <div id="selectNotice" class="bad" style="display:none;margin-bottom:10px"></div>
  <div id="optList"></div>
</div>

<!-- ================= game view ================= -->
<div id="gameView" style="display:none;flex-direction:column;height:100%">
  <div id="hud">
    <div class="pl human" id="hudHuman"></div>
    <div id="hudCenter">
      <div id="hudPhase"></div>
      <div id="hudMain"></div>
    </div>
    <div id="hudAux">
      <span class="dim mono" id="tDigest" title="state digest"></span>
      <button id="btnBack">← 选择</button>
      <button id="btnRefresh">刷新</button>
      <button id="btnAbandon" class="warn">删会话</button>
    </div>
    <div class="pl opp" id="hudOpp"></div>
  </div>
  <div id="main">
    <div id="left">
      <div id="ltabs">
        <button data-t="shop" class="on">单位</button>
        <button data-t="tech">科技</button>
        <button data-t="tower">塔·蓝图</button>
      </div>
      <div id="lbody"></div>
    </div>
    <div id="center">
      <div id="status">正在加载…</div>
      <div id="playctl">
        <button id="ppBack" title="回到开头">⏮</button><button id="ppPlay">⏸</button>
        <input type="range" id="ppSeek" style="flex:1" min="0" value="0">
        <span id="ppTime" class="mono dim"></span>
        <button id="ppExit">退出播放</button>
      </div>
      <div id="stage">
        <canvas id="cv" width="760" height="660"></canvas>
        <div id="tip"></div>
        <div id="cardLayer">
          <h2 id="clTitle"></h2>
          <div class="sub" id="clSub"></div>
          <div id="cards"></div>
        </div>
      </div>
    </div>
    <div id="right"></div>
  </div>
  <div id="audit">
    <div id="auditbar">
      <span class="arrow">▶</span><b>审计</b>
      <span id="abLast" class="dim" style="flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis"></span>
      <span class="dim mono" id="abVer"></span>
    </div>
    <div id="auditPanel">
      <div id="atabs">
        <button data-t="hrec" class="on">人类 Receipts</button>
        <button data-t="orec">对手 Receipts</button>
        <button data-t="ledger">资金账本</button>
        <button data-t="diff">State Diff / 审计</button>
        <button data-t="hist">历史动作对照</button>
        <button data-t="battle">战斗结果 (pysim)</button>
      </div>
      <div id="abody"></div>
    </div>
  </div>
</div>

<div id="overlay"><div class="box" id="overlayBox"></div></div>

<script>
"use strict";
/* =============================================================== api */
const $=id=>document.getElementById(id);
let V=null;            // authoritative GameView (game_view_v2)
let HUMAN=0;           // world player index the human plays
let busy=false;        // a command is in flight
let pickBuy=null;      // {mech_id,price,name} armed buy (G10)
let pickRelease=null;  // {sid,name} armed battlefield skill release
let selUnit=null;      // selected own unit handle
let drag=null;         // {handle,ux,uy,x,y} in WORLD coords
let ghost=null;        // {x,y} world coords for buy ghost
let mode="edit";       // edit | play
let frames=[],events=[],playT=0,playing=false,timer=null,spawnDone={},lastPos={};
let playedBattleRound=null;   // battle round already auto-played
let ltab="shop",atab="hrec";
let lastSupply=null;

async function api(path,opts){
  const r=await fetch(path,opts);
  if(r.status===404&&path.includes("/sessions/")){backToSelect("会话不存在（服务可能已重启）");throw new Error("404");}
  const body=await r.json().catch(()=>({}));
  if(!r.ok){
    if(body&&body.error==="STALE_SESSION_VERSION"){
      /* G10: stale version -> authoritative refresh + drop expired armed state */
      pickBuy=null;pickRelease=null;ghost=null;drag=null;
      await refresh();
    }
    throw Object.assign(new Error(body.error||r.status),{body,status:r.status});
  }
  return body;
}
async function cmd(kind,payload){
  if(!V||busy)return;
  busy=true;flash("提交中: "+kind+" …");
  const armedBuy=pickBuy;         /* 7.2 固定规则: rejected 保留购买态 */
  try{
    const out=await api(`/api/game/sessions/${V.session_id}/commands`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({expected_version:V.version,kind,payload})});
    render(out);
    if(out.rejected_receipt){
      const rr=out.rejected_receipt;
      flash(`❌ 被拒: ${rr.kind} · ${rr.reason_code}${rr.detail?" · "+rr.detail:""}`);
    }else{
      flash(`✓ ${kind} · R${out.round} ${out.phase}`);
      if(armedBuy&&kind==="APPLY_ACTION"){   /* accepted 购买后退出购买态 */
        pickBuy=null;ghost=null;renderLeft();drawEdit();
      }
    }
  }catch(e){ if(!e.body)flash("请求失败: "+e.message); else flash(`❌ ${e.body.error||""} ${e.body.detail||""}`);}
  busy=false;
}
async function refresh(){
  if(!V)return;
  try{render(await api(`/api/game/sessions/${V.session_id}`));}catch(e){}
}
function flash(msg){
  $("status").textContent=msg;
  /* 选择页可见的错误也落到 selectNotice（gameView 隐藏时 status 不可见） */
  const gv=$("gameView"),sn=$("selectNotice");
  if(gv&&gv.style.display==="none"&&sn&&msg.startsWith(("创建失败","请求失败","❌"))){
    sn.textContent=msg;sn.style.display="block";
  }
}

/* ================================================= world/view projection
   G3/§4.2: the ONLY place coordinates flip. Human is always the LOWER
   (view) half, blue; opponent upper, red. view_y = human==0 ? world_y :
   -world_y (X never mirrors). The transform is its own inverse. */
const wvY=y=>HUMAN===0?y:-y;               // world y -> view y (and back)
const vwX=x=>x, wvX=x=>x;                  // x unchanged both ways

/* ------------------------------------------------ canvas geometry (view)
   Screen convention: view y < 0 (the human's half) renders at the BOTTOM,
   view y > 0 (opponent) at the TOP — px/py take WORLD coords and project
   through wvY. */
const W=760,H=660,X0=350,Y0=300;
const px=x=>(wvX(x)+X0)/(2*X0)*W;
const py=y=>(Y0-wvY(y))/(2*Y0)*H;
function evtWorld(e){const r=cv.getBoundingClientRect();
  const cx=(e.clientX-r.left)*(W/r.width),cy=(e.clientY-r.top)*(H/r.height);
  const vy=Y0-cy/H*2*Y0;              /* canvas y -> view y */
  return [cx/W*2*X0-X0, wvY(vy)];}    /* view -> world (wvY is an involution) */
function inOwnHalfWorld(y){return HUMAN===0?y<0:y>0;}

/* ============================================================= rendering */
let lastPhase=null;
function render(view){
  if(view.schema_version!=="game_view_v2"){
    showOverlay(`<h3 style="color:var(--bad)">GameView 契约不兼容</h3>
      <p>页面需要 game_view_v2，服务返回 ${view.schema_version||"??"}。请刷新页面或重建语料后重试。</p>
      <button onclick="hideOverlay()">关闭</button>`);
    return;
  }
  V=view;
  const board=view.board||{};
  HUMAN=(board.human_player!==undefined)?board.human_player
        :(view.replay&&view.replay.human_player)||0;
  $("gameView").style.display="flex";
  $("selectView").style.display="none";
  if(location.hash!=="#s="+V.session_id)location.hash="#s="+V.session_id;
  renderHud();
  if(lastPhase!==V.phase){          /* G14: 离开 phase 清理本地交互态 */
    if(lastPhase!==null){selUnit=null;drag=null;pickBuy=null;pickRelease=null;ghost=null;}
    lastPhase=V.phase;
  }

  /* battle auto-play once per battle round (G13) */
  if(V.phase==="round_result"&&V.battle&&V.battle.round!==playedBattleRound){
    startPlay();
  }else if(V.phase!=="round_result"){
    if(mode==="play")exitPlay();            /* G14 reset on leaving the phase */
    drawEdit();
  }else if(mode!=="play"){
    drawEdit();
  }
  renderCardLayer();
  renderLeft();renderRight();renderAudit();
  if(V.phase==="opening")flash("请选择开局（四选一）");
  if(V.phase==="blocked")showBlocker();
  if(V.phase==="terminal")flash("对局结束: "+(V.stop_reason||"terminal"));
}
function humanP(){return V.players.find(p=>p.role==="human");}
function oppP(){return V.players.find(p=>p.role==="opponent");}
function otherP(side){return V.players.find(p=>p.player===side);}

/* ------------------------------------------------------------- HUD (G7) */
function renderHud(){
  const h=humanP(),o=oppP();
  const hpBar=p=>p.hp===undefined?"":`<div class="hpbar"><i style="width:${Math.max(0,Math.min(100,100*p.hp/p.max_hp))}%"></i></div>`;
  const sub=p=>p.hp===undefined
    ?`<div class="sub">等待开局…</div>`
    :`${hpBar(p)}<div class="sub">HP ${p.hp}/${p.max_hp}${p.role==="human"?` · <span class="supply" id="hudSupply">¥${p.supply}</span> <span class="dim">收入+${p.income_last}</span>`:` · ¥${p.supply} · 收入+${p.income_last}`}</div>`;
  $("hudHuman").innerHTML=`<div class="avatar">你</div><div>
    <div class="nm">${h.name} <span class="dim">(P${h.player})</span></div>
    ${sub({role:"human",hp:h.hp,max_hp:h.max_hp,supply:h.supply,income_last:h.income_last})}</div>`;
  $("hudOpp").innerHTML=`<div><div class="nm" style="text-align:right">${o.name} <span class="dim">(P${o.player})</span></div>
    ${sub({role:"opponent",hp:o.hp,max_hp:o.max_hp,supply:o.supply,income_last:o.income_last})}</div>
    <div class="avatar">敌</div>`;
  $("tDigest").textContent="digest "+(V.state_digest||"").slice(0,10);
  $("tDigest").title=V.state_digest||"";
  if(h.supply!==undefined){
    if(lastSupply!==null&&lastSupply!==h.supply){
      const el=$("hudSupply");if(el){el.classList.add("flash");
        setTimeout(()=>el.classList.remove("flash"),220);}
    }
    lastSupply=h.supply;
  }

  const ph={opening:"开局选择",reinforcement:"增援四选一",deployment:"部署",
    round_result:"战斗结算",terminal:"对局结束",blocked:"已阻塞",
    pre_battle:"待战斗"}[V.phase]||V.phase;
  let mid=`<span class="rnd">R${V.round}</span><span class="tag gold">${ph}</span>`;
  if(V.stop_reason&&V.phase!=="blocked")mid+=`<span class="tag bad">${V.stop_reason}</span>`;
  $("hudPhase").innerHTML=mid;

  /* main action is a FIXED HUD citizen, never inside unit detail (G12) */
  let main="";
  if(V.phase==="deployment"){
    const la=V.legal_actions||{};
    const fin=la.can_finish_deployment!==undefined?la.can_finish_deployment:!humanP().finished_deploy;
    main+=`<button id="btnUndo" title="${la.undo_reason==="UNDO_EMPTY"?"本回合无可撤销动作":la.undo_reason||""}" ${la.can_undo?"":"disabled"}>↩ 撤销</button>`;
    main+=`<button id="btnFinish" class="primary big" ${fin?"":"disabled"}>结束部署 ▶</button>`;
  }else if(V.phase==="round_result"){
    main+=`<button id="btnAck" class="primary big">进入下一回合 ▶</button>`;
  }else if(V.phase==="terminal"){
    main+=`<button id="btnTermBack" class="primary big">返回选择页</button>`;
  }
  $("hudMain").innerHTML=main;
  const bf=$("btnFinish");if(bf)bf.onclick=confirmFinish;
  const bu=$("btnUndo");if(bu)bu.onclick=()=>cmd("UNDO_LAST_HUMAN_ACTION",{});
  const ba=$("btnAck");if(ba)ba.onclick=()=>cmd("ACK_ROUND_RESULT",{});
  const bt=$("btnTermBack");if(bt)bt.onclick=()=>backToSelect();
}

/* ------------------------------------------------------- left panel */
function renderLeft(){
  const b=$("lbody");
  if(ltab==="shop")b.innerHTML=shopHtml();
  else if(ltab==="tech")b.innerHTML=techHtml();
  else b.innerHTML=towerHtml();
  b.querySelectorAll("[data-buy]").forEach(el=>{
    el.onclick=()=>armBuy(+el.dataset.buy);
    el.ondblclick=()=>quickBuy(+el.dataset.buy);
    el.onkeydown=e=>{if(e.key==="Enter")armBuy(+el.dataset.buy);};
  });
  b.querySelectorAll("[data-unlock]").forEach(el=>el.onclick=()=>cmd("APPLY_ACTION",
    {action:{kind:"unlock_unit",args:{mech_id:+el.dataset.unlock}}}));
  b.querySelectorAll("[data-tech]").forEach(el=>el.onclick=()=>cmd("APPLY_ACTION",

function armBuy(id){
  const it=(V.legal_actions.buy||[]).find(x=>x.mech_id===id);
  if(!it)return;
  if(!it.affordable){flash(`资金不足：${it.name} 需要 ¥${it.price}`);return;}
  if(pickBuy&&pickBuy.mech_id===id){pickBuy=null;ghost=null;flash("取消购买");}
  else{pickBuy={mech_id:id,price:it.price,name:it.name};pickRelease=null;
    flash(`已选中 ${it.name}（¥${it.price}）— 点击己方半场放置，ESC 取消`);}
  selUnit=null;renderLeft();drawEdit();
}
function quickBuy(id){                       // Q2 裁决：双击直接买在场地中央
  const it=(V.legal_actions.buy||[]).find(x=>x.mech_id===id);
  if(!it||!it.affordable){flash(`资金不足：${it.name} 需要 ¥${it.price}`);return;}

/* ------------------------------------------------------------ audit (G9) */
function renderAudit(){
  const recs=V.receipts||[];
  const last=recs[recs.length-1];
  $("abLast").textContent=last?
    `最近: R${last.round} P${last.player} ${last.kind} ${last.accepted?"✓":"✗ "+last.reason_code} ${last.detail||""}`:"暂无动作";
  $("abVer").textContent="v"+V.version;
  const b=$("abody");
  if(!$("audit").classList.contains("open"))return;
  if(atab==="hrec")b.innerHTML=recHtml(humanP().player);
  else if(atab==="orec")b.innerHTML=recHtml(oppP().player);
  else if(atab==="ledger")b.innerHTML=ledgerHtml();
  else if(atab==="diff")b.innerHTML=diffHtml();
  else if(atab==="hist")b.innerHTML=histHtml();
  else b.innerHTML=battleHtml();
  b.scrollTop=b.scrollHeight;
}
function roleTag(side){const p=otherP(side);const role=p&&p.role;
  return `<span class="tag ${role==="human"?"blue":"red"}">P${side}·${role==="human"?"你":"对手"}</span>`;}
function recHtml(side){
  const rs=(V.receipts||[]).filter(r=>r.player===side);
  if(!rs.length)return dim("暂无");
  return `<table class="t"><tr><th>#</th><th>R</th><th>动作</th><th>结果</th><th>Δ资金</th><th>detail</th></tr>`+
    rs.slice(-60).map(r=>`<tr><td>${r.seq}</td><td>${r.round}</td><td class="mono">${r.kind}</td>
    <td class="${r.accepted?"ok":"bad"}">${r.accepted?"✓":"✗ "+r.reason_code}</td>
    <td>${r.resource_delta?(r.resource_delta>0?"+":"")+r.resource_delta:""}</td>
    <td class="dim mono">${r.detail||""}</td></tr>`).join("")+"</table>";
}
function ledgerHtml(){
  if(!(V.ledger||[]).length)return dim("本回合暂无账目");
  let s={};
  const rows=V.ledger.map(e=>{
    s[e.player]=(s[e.player]||0)+e.amount;
    return `<tr><td>${roleTag(e.player)}</td><td class="mono">${e.reason}</td>
    <td class="${e.amount>=0?"ok":"bad"}">${e.amount>=0?"+":""}${e.amount}</td><td>R${e.round}</td></tr>`;}).join("");
  return `<table class="t"><tr><th>玩家</th><th>条目</th><th>金额</th><th>回合</th></tr>${rows}</table>
  <div style="margin-top:6px">合计: ${[0,1].map(i=>`P${i} ${s[i]||0}`).join(" · ")}</div>`;
}
function diffHtml(){
  let h=`<div class="mono">digest: <span class="gold" title="点击复制" style="cursor:pointer" onclick="navigator.clipboard&&navigator.clipboard.writeText('${V.state_digest}')">${V.state_digest}</span> · invariants ${V.invariants}</div>`;
  h+=`<div class="diffs" style="margin-top:6px">`;
  if(V.state_diff&&V.state_diff.length){
    h+="<table class='t'><tr><th>路径</th><th>之前</th><th>之后</th></tr>"+
      V.state_diff.map(d=>`<tr><td class="p">${d.path}</td><td class="mono dim">${JSON.stringify(d.before).slice(0,80)}</td><td class="mono">${JSON.stringify(d.after).slice(0,80)}</td></tr>`).join("")+"</table>";
  } else h+="<div class='dim'>本版本无状态差异</div>";
  h+="</div><div style='margin-top:8px' class='dim'>审计事件（最新 60）</div>";
  h+=(V.audit_events||[]).slice(-60).reverse().map(e=>
    `<div class="audit-ev"><span class="gold mono">${e.kind}</span> <span class="dim">v${e.version} R${e.round} p${e.player??"-"} seq${e.seq}</span> ${e.detail||""}</div>`).join("");
  return h;
}
function histHtml(){
  const h=V.historical_actions;
  if(!h||!h.players)return dim("—");
  let out=`<div class="dim">原回放第 ${h.round} 回合动作（仅对照，不参与状态）</div><table class="t"><tr><th>玩家</th><th>原始动作</th></tr>`;
  for(const p of h.players){
    out+=`<tr><td>${roleTag(p.side)}</td><td class="mono">${
      (p.raw||[]).map(a=>a.type+"("+(a.arg?JSON.stringify(a.arg):"")+")").join(" → ")||"—"}</td></tr>`;
  }
  out+="</table>";
  if(h.real_fight)out+=`<div style="margin-top:6px">真实战斗: <b>${h.real_fight.label}</b> · 双方得分 ${JSON.stringify(h.real_fight.real_scores)} <span class="dim">（仅对照）</span></div>`;
  return out;
}
function battleHtml(){
  const b=V.battle;

   <div style="flex:1">

   </div></div>`;
}
function dim(t){return `<div class="dim">${t}</div>`;}

/* ============================================================ canvas */
const cv=$("cv"),ctx=cv.getContext("2d");
const COL={human:{fill:"#3d5a80",stroke:"#6cf"},opponent:{fill:"#80443a",stroke:"#f86"},
  humanDead:"rgba(63,90,128,.35)",oppDead:"rgba(128,68,58,.35)"};

function drawBoard(){
  ctx.fillStyle="#10131a";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#1d2431";ctx.lineWidth=1;
  for(let g=-350;g<=350;g+=50)line(px(g),py(-300),px(g),py(300));
  for(let g=-300;g<=300;g+=50)line(px(-350),py(g),px(350),py(g));
  /* half tints: human bottom (blue), opponent top (red) — view space */
  ctx.fillStyle="rgba(102,153,255,.045)";ctx.fillRect(0,H/2,W,H/2);
  ctx.fillStyle="rgba(255,136,102,.045)";ctx.fillRect(0,0,W,H/2);
  ctx.strokeStyle="#2c3b52";ctx.lineWidth=2;line(px(-350),py(0),px(350),py(0));
  /* towers from the board contract (world -> view), colored by role */
  const board=V&&V.board;
  if(board)for(const bp of board.players||[]){
    for(const t of bp.towers||[]){
      drawHex(px(t.x),py(t.y),12,COL[bp.role].fill);
      ctx.fillStyle="#cfd8e3";ctx.font="10px Consolas";ctx.textAlign="center";
      ctx.fillText("T"+t.index+" L"+t.level,px(t.x),py(t.y)+3);
    }
  }
  /* buy placement guidance (G8): legal own-half highlight + hatch above */
  if(pickBuy&&mode==="edit"){
    ctx.fillStyle="rgba(255,213,74,.07)";ctx.fillRect(0,H/2,W,H/2);
    ctx.save();ctx.beginPath();ctx.rect(0,0,W,H/2);ctx.clip();
    ctx.strokeStyle="rgba(247,119,119,.25)";ctx.lineWidth=1;
    for(let x=-W;x<W;x+=14)line(x,0,x+H/2,H/2);
    ctx.restore();
  }
}
function line(a,b,c,d){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();}
function drawHex(x,y,r,color){
  ctx.beginPath();
  for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/6;
    const X=x+r*Math.cos(a),Y=y+r*Math.sin(a);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}
  ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle="#566";ctx.stroke();
}
function drawUnit(u,role,selected){
  const x=px(u.x),y=py(u.y);
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle=selected?"#8a7a2e":COL[role].fill;
  ctx.strokeStyle=selected?"#ffd54a":COL[role].stroke;
  ctx.lineWidth=selected?2.5:1.5;
  ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fill();ctx.stroke();
  if(selected){ctx.strokeStyle="rgba(255,213,74,.5)";ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(0,0,14,0,7);ctx.stroke();}
  ctx.fillStyle="#e8eef5";ctx.font="9px 'Segoe UI'";ctx.textAlign="center";
  ctx.fillText(u.name.slice(0,4)+"L"+u.level,0,-15);
  if(u.is_rotate){ctx.strokeStyle="#ffd54a";ctx.strokeRect(-12,-12,24,24);}
  ctx.restore();
}
function drawEdit(){
  if(!V||!humanP()||humanP().units===undefined){if(V)drawBoard();return;}
  drawBoard();
  const hp=humanP(),op=oppP();
  for(const u of op.units||[])drawUnit(u,"opponent",selUnit!==null&&u.handle===selUnit);
  for(const u of hp.units||[])drawUnit(u,"human",selUnit!==null&&u.handle===selUnit);
  if(drag){
    ctx.strokeStyle="#ffd54a";ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(px(drag.ux),py(drag.uy));ctx.lineTo(px(drag.x),py(drag.y));
    ctx.stroke();ctx.setLineDash([]);
    drawUnit({name:"",level:0,x:drag.x,y:drag.y},"human",true);
  }
  if(pickBuy&&ghost){
    const legal=inOwnHalfWorld(ghost.y);
    ctx.save();ctx.globalAlpha=.75;
    drawUnit({name:pickBuy.name,level:1,x:ghost.x,y:ghost.y},"human",legal);
    ctx.restore();
    if(!legal){ctx.strokeStyle="var(--bad)";ctx.strokeStyle="#f77";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(px(ghost.x)-14,py(ghost.y)-14);
      ctx.lineTo(px(ghost.x)+14,py(ghost.y)+14);
      ctx.moveTo(px(ghost.x)+14,py(ghost.y)-14);
      ctx.lineTo(px(ghost.x)-14,py(ghost.y)+14);ctx.stroke();}
    ctx.fillStyle="#ffd54a";ctx.font="11px 'Segoe UI'";ctx.textAlign="left";
    ctx.fillText(pickBuy.name+" ¥"+pickBuy.price+(legal?"":" — 需己方半场"),
      Math.min(px(ghost.x)+16,W-150),py(ghost.y)-12);
  }
  if(pickRelease&&ghost){
    ctx.strokeStyle="#7fd";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(px(ghost.x),py(ghost.y),16,0,7);ctx.stroke();
  }
}
/* mouse — all positions flow through evtWorld (view==world via wvY) */
function hitUnit(x,y){
  let best=null,bd=16;
  for(const p of V?V.players:[]){
    for(const u of p.units||[]){
      const d=Math.hypot(u.x-x,u.y-y);
      if(d<bd){bd=d;best={u,role:p.role};}
    }
  }
  return best;
}
cv.addEventListener("mousedown",e=>{
  if(mode!=="play"&&V&&V.phase==="deployment"&&!humanP().finished_deploy&&!pickBuy&&!pickRelease){
    const [x,y]=evtWorld(e);
    const hit=hitUnit(x,y);
    if(hit&&hit.role==="human"){
      selUnit=hit.u.handle;
      drag={handle:hit.u.handle,ux:hit.u.x,uy:hit.u.y,x,y,sx:x,sy:y};
      renderRight();drawEdit();
    }
  }
});
cv.addEventListener("mousemove",e=>{
  const [x,y]=evtWorld(e);
  if(pickBuy||pickRelease){ghost={x,y};if(mode==="edit")drawEdit();}
  if(drag){
    drag.x=Math.max(-350,Math.min(350,x));
    drag.y=Math.max(-300,Math.min(300,y));
    drawEdit();return;
  }
  if(mode==="edit"&&V){                      /* hover tooltip (G8) */
    const hit=hitUnit(x,y);
    const tip=$("tip");
    if(hit){
      const r=cv.getBoundingClientRect(),st=$("stage").getBoundingClientRect();
      tip.innerHTML=`<b>${hit.u.name}</b> L${hit.u.level} · exp ${hit.u.exp}`+
        `<br><span class="dim">${hit.role==="human"?"己方":"对手"} · (${Math.round(hit.u.x)}, ${Math.round(hit.u.y)})${hit.u.is_rotate?" ⟳":""}</span>`;
      tip.style.display="block";
      tip.style.left=Math.min(e.clientX-st.left+14,st.width-190)+"px";
      tip.style.top=Math.min(e.clientY-st.top+10,st.height-60)+"px";
    }else tip.style.display="none";
  }
});
cv.addEventListener("mouseleave",()=>{$("tip").style.display="none";if(pickBuy||pickRelease){ghost=null;drawEdit();}});
window.addEventListener("mouseup",e=>{
  if(!drag)return;
  const d=drag;drag=null;
  const moved=Math.hypot(d.x-d.sx,d.y-d.sy)>4;
  if(moved){                                  /* one MoveUnit per mouseup (G11) */
    cmd("APPLY_ACTION",{action:{kind:"move_unit",args:{
      ref:{handle:d.handle},x:Math.round(d.x*10)/10,y:Math.round(d.y*10)/10}}});
  }else drawEdit();
});
cv.addEventListener("click",e=>{
  if(mode==="play"||!V)return;
  const [x,y]=evtWorld(e);
  const hit=hitUnit(x,y);
  if(hit){selUnit=hit.u.handle;renderRight();drawEdit();return;}
  if(selUnit!==null){selUnit=null;renderRight();drawEdit();}   /* 点空地关闭详情 */
  if(V.phase!=="deployment"||humanP().finished_deploy)return;
  if(pickRelease){
    cmd("APPLY_ACTION",{action:{kind:"raw_unsupported",args:{
      raw_type:"ReleaseCommanderSkill",
      raw:[["ID",pickRelease.sid],["Positions",[{x:Math.round(x*10)/10,y:Math.round(y*10)/10}]]]}}});
    pickRelease=null;ghost=null;renderLeft();return;
  }
  if(pickBuy){
    if(!inOwnHalfWorld(y)){flash("只能放置在己方半场（画面下半场）");return;}
    /* 提交 world 坐标；rejected 保留购买态（cmd 内处理），accepted 退出 */
    cmd("APPLY_ACTION",{action:{kind:"buy_unit",args:{
      mech_id:pickBuy.mech_id,x:Math.round(x*10)/10,y:Math.round(y*10)/10}}});
  }
});
window.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if(pickBuy||pickRelease){pickBuy=null;pickRelease=null;ghost=null;renderLeft();drawEdit();flash("已取消");}
    else if(selUnit!==null){selUnit=null;renderRight();drawEdit();}
    hideOverlay();
  }
});

/* ================================================= battle player (G13) */
function startPlay(){
  const b=V.battle;
  if(!b||!b.trace||!b.trace.length){flash("战斗无 trace");return;}
  frames=[];events=[];spawnDone={};lastPos={};playT=0;
  for(const ln of b.trace){
    const f=ln.split("|");
    if(f[0]==="E"){
      if(f[2]==="kill")events.push({t:+f[1],ku:+f[3],km:+f[4],vu:+f[5],vm:+f[6]});
      else if(f[2]==="tower_down")events.push({t:+f[1],kind:"tdown",team:+f[3]});
      else if(f[2]==="paralyse")events.push({t:+f[1],kind:"par",team:+f[3],until:+f[4]});
      else if(f[2]==="skill")events.push({t:+f[1],kind:"skl",team:+f[3],sub:f[4],x:+f[5],y:+f[6]});
      else if(f[2]==="device_down")events.push({t:+f[1],kind:"ddown",team:+f[3]});
      else if(f[2]==="spawn")spawnDone[+f[3]]=+f[1];
      continue;
    }
    frames.push({t:+f[0],u:f.slice(1).map(s=>{const a=s.split(",");
      return{uid:+a[0],team:+a[1],mech:+a[2],alive:+a[3],x:+a[4],y:+a[5],hp:+a[6]};})});
  }
  mode="play";playedBattleRound=b.round;
  $("playctl").style.display="flex";$("ppSeek").max=Math.max(0,frames.length-1);
  playing=true;$("ppPlay").textContent="⏸";
  clearInterval(timer);timer=setInterval(stepPlay,100);
  renderCardLayer();drawPlay();
}
function stepPlay(){
  if(!playing)return;
  if(playT>=frames.length-1){playing=false;$("ppPlay").textContent="▶";clearInterval(timer);return;}
  playT++;drawPlay();
}
function teamRole(team){return team===HUMAN?"human":"opponent";}   /* G13 */
function drawPlay(){
  if(!frames.length)return;
  const fr=frames[playT];
  $("ppSeek").value=playT;
  $("ppTime").textContent=fr.t.toFixed(1)+"s / "+(frames[frames.length-1].t).toFixed(1)+"s";
  drawBoard();
  for(const un of fr.u)lastPos[un.uid]=[un.x,un.y];
  const floats=[];
  for(const ev of events){
    if(ev.t<=fr.t&&ev.t>fr.t-1.5){
      if(ev.ku!==undefined){
        const p=lastPos[ev.vu];if(p)floats.push({x:p[0],y:p[1],txt:"✖",c:"#f77"});
      }else if(ev.kind==="tdown"){
        const tw=((V.board&&V.board.players)||[]).find(p=>p.player===ev.team);
        const t2=tw&&tw.towers&&tw.towers[0];
        floats.push({x:t2?t2.x:0,y:t2?t2.y:(ev.team?170:-170),txt:"核心塔被摧毁!",c:"#ffd54a"});
      }else if(ev.kind==="par")floats.push({x:0,y:ev.team===HUMAN?-60:60,txt:"瘫痪",c:"#7fd"});
      else if(ev.kind==="skl")floats.push({x:ev.x,y:ev.y,txt:"⚡"+ev.sub,c:"#7fd"});
    }
  }
  for(const un of fr.u){
    const x=px(un.x),y=py(un.y);
    const role=teamRole(un.team);
    if(un.mech===-1){drawHex(x,y,11,COL[role].fill);continue;}
    if(un.mech===-2){ctx.beginPath();ctx.arc(x,y,16,0,7);ctx.strokeStyle="#7fd";ctx.stroke();continue;}
    if(un.mech===-3){ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/45);
      ctx.fillStyle=COL[role].fill;ctx.fillRect(-7,-7,14,14);ctx.restore();continue;}
    ctx.beginPath();ctx.arc(x,y,un.alive?7:3,0,7);
    ctx.fillStyle=un.alive?(role==="human"?"#5f9fd6":"#d67f5f"):"rgba(120,120,120,.3)";
    ctx.fill();
    if(!un.alive)continue;
    const sp=spawnDone[un.uid]||0;
    if(fr.t<sp){ctx.strokeStyle="#ffd54a";ctx.beginPath();ctx.arc(x,y,10,-Math.PI/2,
      -Math.PI/2+Math.PI*2*fr.t/sp);ctx.stroke();}
    ctx.fillStyle="#9ab";ctx.font="8px Consolas";ctx.textAlign="center";ctx.fillText(un.hp,x,y-9);
  }
  for(const fl of floats){ctx.fillStyle=fl.c;ctx.font="11px 'Segoe UI'";ctx.textAlign="center";
    ctx.fillText(fl.txt,px(fl.x),py(fl.y));}
}
$("ppPlay").onclick=()=>{playing=!playing;$("ppPlay").textContent=playing?"⏸":"▶";
  if(playing){clearInterval(timer);timer=setInterval(stepPlay,100);}};
$("ppBack").onclick=()=>{playT=0;drawPlay();};
$("ppSeek").oninput=e=>{playT=+e.target.value;drawPlay();};
$("ppExit").onclick=()=>{exitPlay();drawEdit();};
function exitPlay(){       /* G14: 播放器状态全部丢弃，部署坐标来自 GameView */
  mode="edit";playing=false;clearInterval(timer);
  frames=[];events=[];playT=0;spawnDone={};lastPos={};
  drag=null;pickBuy=null;pickRelease=null;ghost=null;
  $("playctl").style.display="none";
  renderCardLayer();
}

async function startGame(optionId,startMode){
  const o=LIB.options.find(x=>x.option_id===optionId);if(!o)return;
  const rb=o.first_runtime_blocker;
  if(startMode==="limited"){
    /* 页内确认层（不阻塞页面）: 写明预计停止回合与原因 */
    showOverlay(`<h3>受限开始</h3>
      <p style="margin:10px 0">该选项可玩前缀为 <b>R${o.playable_through_round}</b>（不足普通开始的 ${LIB.min_rounds} 回合）。</p>
      ${rb?`<p>预计 <b class="bad">R${rb.round}</b> 停止: ${rb.code}<br><span class="dim">${(rb.detail||"").slice(0,90)}</span></p>`:""}
      <p class="dim">受限开始将在前缀尽头以明确 BLOCKED 原因停止（审计目标之一）。</p>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button onclick="hideOverlay()">取消</button>
        <button class="warn" id="ovLimited">受限开始 ▶</button></div>`);
    $("ovLimited").onclick=()=>{hideOverlay();createSession(o,"limited");};
    return;
  }
  createSession(o,startMode);
}
async function createSession(o,startMode){
  busy=true;flash("创建会话…");
  try{
    const v=await api("/api/game/sessions",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({replay_id:o.replay_id,opponent_player:o.opponent_player,
        min_rounds:startMode==="limited"?LIB.limited_min_rounds:LIB.min_rounds})});
    resetLocal();
    render(v);
    flash("会话已创建 — 请在开局四卡中选择");
  }catch(e){
    flash("创建失败: "+(e.body?e.body.error+" "+e.body.detail:e.message));
  }
  busy=false;
}
function resetLocal(){       /* 进入新会话：不复用刷新前本地状态 */
  V=null;HUMAN=0;pickBuy=null;pickRelease=null;selUnit=null;drag=null;ghost=null;
  mode="edit";playedBattleRound=null;lastSupply=null;lastPhase=null;
  exitPlay();
}
function backToSelect(msg){
  resetLocal();
  $("gameView").style.display="none";
  $("selectView").style.display="block";
  location.hash="";
  const sn=$("selectNotice");
  if(msg){sn.textContent=msg;sn.style.display="block";}
  else sn.style.display="none";
  hideOverlay();
  loadLibrary();
}
$("btnBack").onclick=()=>backToSelect();
$("btnRefresh").onclick=()=>refresh();
$("btnAbandon").onclick=()=>{
  if(!V)return;
  showOverlay(`<h3>删除会话？</h3><p class="dim" style="margin:10px 0">会话为内存态，删除后无法恢复。</p>
    <div style="display:flex;gap:8px;margin-top:12px">
    <button onclick="hideOverlay()">取消</button>
    <button class="warn" id="ovDel">删除并返回</button></div>`);
  $("ovDel").onclick=async()=>{
    hideOverlay();
    try{await api("/api/game/sessions/"+V.session_id,{method:"DELETE"});}catch(e){}
    backToSelect();
  };
};
window.hideOverlay=hideOverlay;

/* ================================================================ boot */
(async function(){
  loadLibrary();
  const m=location.hash.match(/#s=([0-9a-f]+)/);
  if(m){
    try{
      const v=await api("/api/game/sessions/"+m[1]);
      resetLocal();          /* hash 恢复：以 GET 返回的 phase 重新初始化 */
      render(v);
    }catch(e){/* 404 handled */}
  }
})();
</script>
</body>
</html>
